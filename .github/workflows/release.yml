name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore ApiKeyVault.slnx

      - name: Run Test Suites
        run: dotnet test ApiKeyVault.slnx -c Release -p:UseSharedCompilation=false --verbosity normal

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          $rawTag = "${{ github.event.inputs.tag_name || github.ref_name }}"
          if ($rawTag -eq 'main' -or -not $rawTag) {
              [xml]$props = Get-Content Directory.Build.props
              $propVer = ($props.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
              $propText = if ($propVer -is [System.Xml.XmlElement]) { $propVer.'#text' } else { [string]$propVer }
              $version = ($propText -replace '-dev$', '').Trim()
              $rawTag = "v$version"
          }
          else {
              # Strip leading 'v' if present (e.g. v1.0.0 -> 1.0.0)
              $version = if ($rawTag.StartsWith('v')) { $rawTag.Substring(1) } else { $rawTag }
          }
          Write-Host "Releasing version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag_name=$rawTag" >> $env:GITHUB_OUTPUT

      - name: Publish Windows x64 (Single-File EXEs & ZIP)
        shell: pwsh
        run: |
          ./scripts/publish.ps1 -Runtime win-x64 -Zip -Version ${{ steps.get_version.outputs.version }}

      - name: Publish Windows ARM64 (Single-File EXEs & ZIP)
        shell: pwsh
        run: |
          ./scripts/publish.ps1 -Runtime win-arm64 -Zip -Version ${{ steps.get_version.outputs.version }}

      - name: Publish Portable Build (Cross-Platform ZIP)
        shell: pwsh
        run: |
          ./scripts/publish.ps1 -Runtime portable -Zip -Version ${{ steps.get_version.outputs.version }}

      - name: Extract Release Notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.version }}"
          $tagName = "${{ steps.get_version.outputs.tag_name }}"
          $notesPath = "dist/release-notes.md"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          $bodyLines = [System.Collections.Generic.List[string]]::new()
          if (Test-Path "CHANGELOG.md") {
              $lines = Get-Content -Encoding utf8 "CHANGELOG.md"
              $capturing = $false
              $headingPattern = "^##\s+\[?v?$([regex]::Escape($version))\]?(\s|$|-)"
              foreach ($line in $lines) {
                  if ($line -match '^##\s+') {
                      if ($capturing) { break }
                      if ($line -match $headingPattern) {
                          $capturing = $true
                          continue
                      }
                  }
                  elseif ($capturing) {
                      $bodyLines.Add($line)
                  }
              }
          }

          $body = ($bodyLines -join "`n").Trim()
          $prevTag = git describe --tags --abbrev=0 "$tagName^" 2>$null
          if (-not $prevTag) {
              $prevTag = git tag --sort=-v:refname | Where-Object { $_ -ne $tagName } | Select-Object -First 1
          }

          if (-not $body) {
              $range = if ($prevTag) { "$prevTag..$tagName" } else { $tagName }
              $commits = git log $range --no-merges --pretty=format:"- %s"
              if ($commits) {
                  $body = "### Changes`n`n" + ($commits -join "`n")
              }
          }

          if ($prevTag -and $body -notmatch 'Full Changelog:') {
              $body += "`n`n**Full Changelog**: https://github.com/${{ github.repository }}/compare/$prevTag...$tagName"
          }

          [IO.File]::WriteAllText($notesPath, $body, [Text.UTF8Encoding]::new($false))

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: ApiKeyVault ${{ steps.get_version.outputs.tag_name }}
          body_path: dist/release-notes.md
          files: |
            dist/ApiKeyVault-win-x64.zip
            dist/ApiKeyVault-win-arm64.zip
            dist/ApiKeyVault-portable.zip
            dist/win-x64/ApiKeyVault.exe
            dist/win-x64/akv.exe
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.tag_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
